name: querypilot
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${QUERY_PILOT_BACKEND_PORT:-8000}:8000"
    environment:
      GO_JUDGE_URL: http://go-judge:5050
      QUERY_PILOT_MODEL_ORIGINS: "${QUERY_PILOT_MODEL_ORIGINS:-https://api.openai.com,https://api.deepseek.com}"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 5
    depends_on:
      go-judge:
        condition: service_healthy
    networks:
      - default
      - sandbox

  go-judge:
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox
    privileged: true
    shm_size: 256m
    command: ["-http-addr", ":5050", "-no-fallback", "-parallelism", "4"]
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5050/version', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 5
    networks:
      - sandbox

  web:
    build: ./frontend
    ports:
      - "${QUERY_PILOT_BIND_ADDRESS:-127.0.0.1}:${QUERY_PILOT_WEB_PORT:-8080}:80"
      - "${QUERY_PILOT_BIND_ADDRESS:-127.0.0.1}:${QUERY_PILOT_HTTPS_PORT:-8443}:443"
    environment:
      QUERY_PILOT_SITE_ADDRESS: "${QUERY_PILOT_SITE_ADDRESS:-:80}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 4s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  sandbox:
    internal: true
