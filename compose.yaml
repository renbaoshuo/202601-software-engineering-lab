name: querypilot
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${QUERY_PILOT_BACKEND_PORT:-8000}:8000"
    environment:
      GO_JUDGE_URL: http://go-judge:5050
    depends_on:
      - go-judge
    networks:
      - default
      - sandbox

  go-judge:
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox
    privileged: true
    shm_size: 256m
    command: ["-http-addr", ":5050", "-no-fallback", "-parallelism", "4"]
    networks:
      - sandbox

networks:
  sandbox:
    internal: true
